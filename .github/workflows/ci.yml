name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: memory_stem
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      # Unit tests use FakeEmbedder; real-vault recall evals run locally (they quote the owner's life).
      - run: python -m unittest discover -s memory_stem/tests -t .
      # Personal terms live in a repo secret (never in the repo); the guard prints only file:line, never the term.
      - name: Privacy guard
        env:
          DENYLIST: ${{ secrets.MEMORY_STEM_DENYLIST_TEXT }}
        run: |
          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            export MEMORY_STEM_DENYLIST="$RUNNER_TEMP/denylist.txt"
          fi
          python memory_stem/scripts/privacy_guard.py memory_stem
